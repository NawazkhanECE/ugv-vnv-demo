name: UGV CI V&V Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  vnv-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Testing Image
        run: |
          docker build -t ugv-vnv-test:latest .

      - name: Execute Pytest Unit Tests
        run: |
          docker run --rm ugv-vnv-test:latest

      # --- NEW: REGISTRY PUSH STEPS ---
      # 1. Tag the image for your registry address
      - name: Tag Docker Image for Registry
        run: |
          docker tag ugv-vnv-test:latest localhost:5000/ugv-vnv-test:latest

      # 2. Push the image to the registry 
      # (In real deployment, you would also log into your registry first using docker login)
      - name: Push Docker Image to Registry
        run: |
          docker push localhost:5000/ugv-vnv-test:latest