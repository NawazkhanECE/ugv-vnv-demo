name: UGV CI V&V Pipeline

# 1. Trigger: Run this whenever someone pushes code to the 'dev' branch
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  vnv-check:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull the repository code onto the GitHub cloud machine
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Build the Docker image using your Dockerfile
      - name: Build Docker Testing Image
        run: |
          docker build -t ugv-vnv-test:latest .

      # Step 3: Run the unit tests inside the built Docker container
      - name: Execute Pytest Unit Tests
        run: |
          docker run --rm ugv-vnv-test:latest